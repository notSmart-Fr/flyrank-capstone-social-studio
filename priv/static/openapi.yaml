openapi: 3.0.0

# ==============================================================================
# API METADATA & SERVER CONFIGURATION
# ==============================================================================
info:
  title: Flyrank Capstone Social Studio API
  version: 1.0.0
  description: API documentation for managing blog posts, campaign variants, and social publishing slots.

servers:
  - url: http://localhost:4000
    description: Local Development Server
  

# ==============================================================================
# LOGICAL TAG GROUPS (Sidebar navigation in Scalar)
# ==============================================================================
tags:
  - name: Posts
    description: Blog post ingestion, campaign retrieval, and variant generation
  - name: Variants
    description: Variant editing, approvals, and scheduling
  - name: Publishing
    description: Slot publishing execution and audit logs
  - name: System
    description: Health checks

# ==============================================================================
# DATA SCHEMAS & MODELS (UPDATE DB FIELDS HERE)
# ==============================================================================
components:
  schemas:

    # --------------------------------------------------------------------------
    # INPUT PAYLOAD: POST /api/blog-posts
    # What the client sends when creating a new blog campaign.
    # --------------------------------------------------------------------------
    CreatePostRequest:
      type: object
      required:
        - post
        - platforms
      properties:
        post:
          type: object
          required:
            - title
            - content
            - source_type
          properties:
            title:
              type: string
              example: "My First Blog Post"
              description: Campaign post title
            content:
              type: string
              example: "Raw blog body or markdown..."
              description: Source content used by AI to generate variants
            source_type:
              type: string
              enum: [markdown, url]
              example: markdown
              description: Format of source content
        platforms:
          type: array
          description: Target social networks to generate draft variants for
          items:
            type: string
            enum: [telegram, mock_x, mock_linkedin]
          example: ["telegram", "mock_x", "mock_linkedin"]

    # --------------------------------------------------------------------------
    # OUTPUT MODEL: Individual Social Variant
    # Represents a single AI draft + token usage and USD generation cost.
    # UPDATE HERE: If you add new columns to the `variants` DB table.
    # --------------------------------------------------------------------------
    Variant:
      type: object
      description: Represents generated social content draft + per-variant AI token & cost metrics.
      properties:
        id:
          type: integer
          example: 10
          description: Primary key ID of the variant
        platform:
          type: string
          example: telegram
          description: Target platform identifier
        variant_label:
          type: string
          example: A
          description: A/B test label ('A' or 'B')
        content:
          type: string
          example: "Generated post content #tech"
          description: Draft social text content
        status:
          type: string
          enum: [draft, approved, rejected]
          example: draft
          description: Editorial lifecycle state
        rejection_reason:
          type: string
          nullable: true
          example: "Needs shorter hook"
          description: Reviewer feedback if rejected

        # --- AI Token & Cost Metrics (Gemini Tracking) ---
        prompt_tokens:
          type: integer
          example: 240
          description: Input prompt token count consumed during generation
        completion_tokens:
          type: integer
          example: 110
          description: Output token count generated by the AI model
        total_tokens:
          type: integer
          example: 350
          description: Total combined token usage for this variant
        generation_cost:
          type: number
          format: double
          example: 0.000051
          description: Calculated USD cost to generate this variant ($0.075/1M input, $0.30/1M output)
        model_used:
          type: string
          example: gemini-2.5-flash
          description: AI model name and version responsible for generation

    # --------------------------------------------------------------------------
    # OUTPUT MODEL: Campaign / Parent Blog Post
    # Combines post info, total aggregated campaign cost, and variants array.
    # UPDATE HERE: If you add campaign-level metadata to the `posts` table.
    # --------------------------------------------------------------------------
    Campaign:
      type: object
      description: Represents the ingested blog post, total aggregated AI cost, and variants array.
      properties:
        id:
          type: integer
          example: 1
          description: Primary key ID of the post/campaign
        title:
          type: string
          example: "My First Blog Post"
          description: Campaign title
        source_type:
          type: string
          example: markdown
          description: Source ingestion format
        
        # Aggregated AI Campaign Cost
        total_ai_cost:
          type: number
          format: double
          example: 0.000306
          description: Summed USD generation cost across all platform draft variants in this campaign

        variants:
          type: array
          description: Generated platform draft variants attached to this campaign
          items:
            $ref: '#/components/schemas/Variant'

# ==============================================================================
# API ROUTE MAPPINGS (URL PATHS & CONTROLLERS)
# Maps endpoints to their Phoenix controllers and HTTP responses.
# ==============================================================================
paths:

  # ----------------------------------------------------------------------------
  # POSTS & CAMPAIGN ENDPOINTS
  # Controller: PostController & CampaignController
  # ----------------------------------------------------------------------------
  /api/blog-posts:
    post:
      tags: [Posts]
      summary: Ingest a blog post and generate variants
      description: Ingests source text or URL, invokes Gemini to produce A/B variants, and calculates costs.
      operationId: PostController.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Campaign created with variants and cost metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '422':
          description: Invalid post payload or missing parameters

  /api/campaigns/{id}:
    get:
      tags: [Posts]
      summary: Get campaign details and AI cost breakdown
      description: Fetches single campaign post along with all associated platform variants and total AI cost.
      operationId: CampaignController.show
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Campaign / Post Database ID
      responses:
        '200':
          description: Campaign and cost metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          description: Campaign ID does not exist

  # ----------------------------------------------------------------------------
  # VARIANT EDITING & EDITORIAL LIFECYCLE
  # Controller: VariantController
  # ----------------------------------------------------------------------------
  /api/variants/{id}:
    patch:
      tags: [Variants]
      summary: Edit variant content
      description: Updates text content of a variant draft before approval.
      operationId: VariantController.update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Variant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              content: "Updated social post content #tech"
      responses:
        '200':
          description: Variant successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '422':
          description: Validation failure on updated content

  /api/variants/{id}/approve:
    post:
      tags: [Variants]
      summary: Approve a draft variant
      description: Flips variant status to 'approved', unlocking scheduling capabilities.
      operationId: VariantController.approve
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Variant ID
      responses:
        '200':
          description: Variant status updated to 'approved'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '422':
          description: Variant state transition not allowed

  /api/variants/{id}/reject:
    post:
      tags: [Variants]
      summary: Reject a variant draft
      description: Flips variant status to 'rejected' and logs mandatory rejection feedback.
      operationId: VariantController.reject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Variant ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              rejection_reason: "Needs shorter hook and better hashtags"
      responses:
        '200':
          description: Variant status updated to 'rejected'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '422':
          description: Variant state transition not allowed

  /api/variants/{id}/schedule:
    post:
      tags: [Variants]
      summary: Schedule an approved variant for publishing
      description: Enforces invariant check (status must be 'approved') and creates a publishing Slot with an Idempotency Key.
      operationId: VariantController.schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Variant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              scheduled_at: "2026-09-20T10:00:00Z"
      responses:
        '201':
          description: Publishing slot created successfully
        '403':
          description: "Refused: Variant is in draft or rejected state"
        '422':
          description: Invalid datetime or scheduling payload

  # ----------------------------------------------------------------------------
  # PUBLISHING EXECUTION & AUDIT LOGS
  # Controller: SlotController & CampaignController
  # ----------------------------------------------------------------------------
  /api/slots/{id}/publish:
    post:
      tags: [Publishing]
      summary: Publish a scheduled slot to social platforms
      description: Triggers social adapter dispatch. Handles duplicate execution gracefully via idempotency guards.
      operationId: SlotController.publish
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Slot ID
      responses:
        '200':
          description: Slot dispatched successfully or already published (short-circuited)
        '422':
          description: Platform API execution failed

  /api/publishing/history:
    get:
      tags: [Publishing]
      summary: Retrieve publishing audit history
      description: Returns list of all execution attempts, including platform responses, statuses, and error logs.
      operationId: CampaignController.history
      responses:
        '200':
          description: PublishAttempt history records retrieved

  # ----------------------------------------------------------------------------
  # SYSTEM HEALTH
  # Controller: HealthController
  # ----------------------------------------------------------------------------
  /api/health:
    get:
      tags: [System]
      summary: Check API and database connection health
      description: Returns HTTP 200 if Phoenix server and Postgres connection are active.
      operationId: HealthController.check
      responses:
        '200':
          description: System operational
        '503':
          description: Database connection error